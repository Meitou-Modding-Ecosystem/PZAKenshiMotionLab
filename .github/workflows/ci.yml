name: CI
on:
  pull_request:
    branches: [master, release]
  push:
    branches: [master, release]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    uses: TheIvoryDisaster/GutenStructure/.github/workflows/build-python.yml@fc0507fb376b8b8ba732795c7032c9cd81464a58
    with:
      requirements: requirements-ci.txt
      test-command: |
        python tests/test_pipeline.py
        python tests/test_no_pillow.py
        python tests/fuzz/fuzz_glb.py 400
        python tools/build_addon.py
  release-readiness:
    name: Release readiness
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all prerequisite checks
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          python - <<'PYCODE'
          import os
          results = os.environ['RESULTS'].split(',')
          if not results or any(result != 'success' for result in results):
              raise SystemExit('A required check failed, was cancelled, or was skipped')
          PYCODE
